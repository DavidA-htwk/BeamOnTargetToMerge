[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "BeamOnTarget"
version = "1.0.0"
description = "Neutral beam particle deposition simulation and analysis tool"
readme = "README.md"
license = {text = "LGPL-3.0-only"}
authors = [
    {name = "Carlo Poggi", email = "carlo.poggi@iter.org"},
]
maintainers = [
    {name = "Carlo Poggi", email = "carlo.poggi@iter.org"},
]
keywords = [
    "neutral beam injection",
    "particle tracking",
    "power deposition",
    "plasma physics",
    "fusion",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26",
    "trimesh>=3.23",
    "pyembree>=0.1.12",
    "embreex>=2.17",
    "pyvista[all]",
    "tqdm",
    "pandas",
    "scipy",
    "fast_simplification",
    "joblib",
    "open3d>=0.17",
    "threadpoolctl",
    "matplotlib",
    "Pillow",
]

# TODO: replace with the final published URL before the repository goes public.
[project.urls]
Homepage = "https://github.com/iterorganization/BeamOnTarget"
Source = "https://github.com/iterorganization/BeamOnTarget"
Issues = "https://github.com/iterorganization/BeamOnTarget/issues"

[project.scripts]
beamontarget = "beamontarget.gui.sim_gui:main"
beamontarget-run = "beamontarget.workflows.run_simulation:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["beamontarget*"]

